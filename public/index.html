<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d5c36;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #0d5c36 0%, #06331e 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #d1fae5;
            --success-text: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 16px;
        }

        /* Header Brand */
        .brand-container {
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #ffffff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .brand-container h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .brand-container p {
            font-size: 12px;
            color: #a7f3d0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kartu Utama */
        .search-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(13, 92, 54, 0.1);
        }

        .btn-cek {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cek:hover {
            background: #1d4ed8;
        }

        /* Bagian Informasi & Pembayaran */
        .result-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .santri-info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .badge-status {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .payment-group {
            margin-bottom: 14px;
        }

        .payment-group select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-bayar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-bayar:hover {
            background: #094428;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 51, 30, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 20px 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header Brand -->
    <div class="brand-container">
        <div class="logo-circle">
            <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Utama -->
    <div class="search-card">
        <label class="input-label" for="nis">Nomor Induk Santri (NIS)</label>
        <div class="input-group">
            <input type="text" id="nis" placeholder="Contoh: 20260001" autocomplete="off">
            <button class="btn-cek" onclick="cekDataSantri()">Cek</button>
        </div>

        <!-- Bagian Informasi & Pembayaran -->
        <div class="result-section" id="resultSection">
            <div class="santri-info-box">
                <div class="info-row">
                    <span class="info-label">Nama Santri</span>
                    <span class="info-value" id="txtNama">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kelas</span>
                    <span class="info-value" id="txtKelas">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Wali Santri</span>
                    <span class="info-value" id="txtWali">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">No. Telepon</span>
                    <span class="info-value" id="txtTelp">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status Terakhir</span>
                    <span class="info-value"><span class="badge-status" id="txtStatus">AKTIF</span></span>
                </div>
            </div>

            <div class="payment-group">
                <label class="input-label" for="bulan">Pilih Bulan Pembayaran</label>
                <select id="bulan">
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November" selected>November</option>
                    <option value="Desember">Desember</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                </select>
            </div>

            <button class="btn-bayar" onclick="prosesPembayaran()">
                <i class="fa-solid fa-circle-check"></i> Bayar & Buat Kolom Otomatis
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Memeriksa database...</div>
        </div>
    </div>

<script>
    // URL Web App Google Apps Script terbaru Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVEoquoZd9ojPxubLyHjUfGp6yDQm_Kqjw8gCFPiE9hJXRZyJeommvr-O_5XzJ1YRAEQ/exec";

    function cekDataSantri() {
        var nis = document.getElementById("nis").value.trim();
        if (!nis) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }

        document.getElementById("loaderText").innerText = "Mencari data santri...";
        document.getElementById("loadingOverlay").style.display = "flex";

        // Memanggil data santri via GET parameter ke URL terbaru
        fetch(WEB_APP_URL + "?nis=" + encodeURIComponent(nis))
        .then(response => response.json())
        .then(data => {
            document.getElementById("loadingOverlay").style.display = "none";
            if (data && data.found) {
                document.getElementById("txtNama").innerText = data.nama;
                document.getElementById("txtKelas").innerText = data.kelas;
                document.getElementById("txtWali").innerText = data.wali;
                document.getElementById("txtTelp").innerText = data.telp;
                document.getElementById("txtStatus").innerText = "TERVERIFIKASI";
                document.getElementById("resultSection").style.display = "block";
            } else {
                alert("Santri dengan NIS " + nis + " tidak ditemukan!");
                document.getElementById("resultSection").style.display = "none";
            }
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            console.error(error);
            alert("Gagal terhubung ke database. Pastikan fungsi doGet pada Code.gs aktif.");
        });
    }

    function prosesPembayaran() {
        var nis = document.getElementById("nis").value.trim();
        var bulan = document.getElementById("bulan").value;

        if (!nis) return;

        var dataKirim = { nis: nis, bulan: bulan };

        document.getElementById("loaderText").innerText = "Memproses pembayaran...";
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataKirim)
        })
        .then(() => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Pembayaran bulan " + bulan + " berhasil! Kolom bulan otomatis dibuat (jika belum ada) dan status diperbarui.");
            document.getElementById("nis").value = "";
            document.getElementById("resultSection").style.display = "none";
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Terjadi kesalahan: " + error);
        });
    }
</script>

</body>
</html>
