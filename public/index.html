<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran SPP - PPFHA</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-color: #047857;
            --primary-dark: #065f46;
            --accent-color: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-light: #6b7280;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 24px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary-color);
        }
        .search-box button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background-color: var(--primary-dark);
        }
        .loading {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .santri-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }
        .santri-info p {
            font-size: 0.9rem;
            margin-bottom: 6px;
        }
        .santri-info span {
            font-weight: 600;
            color: var(--text-color);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            outline: none;
        }
        .summary-box {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .summary-box p {
            font-size: 0.9rem;
            color: #065f46;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .summary-box .total {
            font-weight: 700;
            font-size: 1.1rem;
            border-top: 1px solid #a7f3d0;
            padding-top: 6px;
            margin-top: 6px;
        }
        .btn-pay {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn-pay:hover {
            background-color: var(--primary-dark);
        }
        .cash-section {
            margin-top: 20px;
            border-top: 1px dashed #d1d5db;
            padding-top: 15px;
            display: none;
        }
        .btn-cash {
            width: 100%;
            background-color: #d97706;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cash:hover {
            background-color: #b45309;
        }
        .footer-admin {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
        }
        .footer-admin a {
            color: var(--text-light);
            text-decoration: none;
        }
        .footer-admin a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>PPFHA AL-QAROBIYAH</h1>
        <p>Portal Pembayaran SPP Pondok Pesantren</p>
    </div>

    <div class="loading" id="loadingText">Memuat database santri...</div>

    <div class="search-box">
        <input type="number" id="nisInput" placeholder="Masukkan NIS Santri..." />
        <button onclick="cariSantri()">Cek</button>
    </div>

    <div class="error-msg" id="errorMsg">NIS tidak ditemukan di database!</div>

    <div class="santri-card" id="santriCard">
        <div class="santri-info" id="santriInfo"></div>
        
        <div class="form-group" style="margin-top: 15px;">
            <label for="bulanSelect">Pilih Jumlah Bulan Pembayaran</label>
            <select id="bulanSelect" onchange="hitungTotal()">
                <option value="1">1 Bulan</option>
                <option value="2">2 Bulan</option>
                <option value="3">3 Bulan</option>
                <option value="6">6 Bulan</option>
                <option value="12">1 Bulan (Lunas 1 Tahun)</option>
            </select>
        </div>

        <div class="summary-box" id="summaryBox">
            <p><span>Nominal SPP:</span> <span id="nominalAsli">Rp 0</span></p>
            <p><span>Periode:</span> <span id="jmlBulanText">1 Bulan</span></p>
            <p class="total"><span>Total Bayar:</span> <span id="totalBayar">Rp 0</span></p>
        </div>

        <a href="#" id="btnOnline" class="btn-pay" target="_blank">Bayar Online (Mayar.id / QRIS)</a>

        <!-- Area Tombol Khusus Bendahara -->
        <div class="cash-section" id="cashSection">
            <button class="btn-cash" onclick="catatTunai()">Catat Pembayaran Tunai (Cash)</button>
        </div>
    </div>

    <div class="footer-admin">
        <a href="#" onclick="loginBendahara()">Login Khusus Bendahara (Cash)</a>
    </div>
</div>

<script>
    let databaseSantri = [];
    let santriAktif = null;

    // Link CSV Google Sheets Anda
    const csvUrl = "https://docs.google.com/spreadsheets/d/1cqGQaKIOWmYopQPQyI5LTCB77wbLWKoxAqUBDGiSKMw/export?format=csv";

    // Muat data otomatis saat web dibuka
    window.onload = function() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                databaseSantri = results.data;
                document.getElementById('loadingText').style.display = 'none';
            },
            error: function(err) {
                document.getElementById('loadingText').innerText = "Gagal memuat database. Periksa koneksi.";
            }
        });
    };

    function cariSantri() {
        const nisCari = document.getElementById('nisInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const santriCard = document.getElementById('santriCard');

        errorMsg.style.display = 'none';
        santriCard.style.display = 'none';

        if (!nisCari) {
            errorMsg.innerText = "Silakan masukkan NIS terlebih dahulu!";
            errorMsg.style.display = 'block';
            return;
        }

        // Cari data berdasarkan NIS di Google Sheets
        const hasil = databaseSantri.find(s => String(s.NIS).trim() === nisCari);

        if (hasil) {
            santriAktif = hasil;
            
            let htmlInfo = `
                <p><span>NIS:</span> ${hasil.NIS}</p>
                <p><span>Nama Santri:</span> ${hasil['Nama Santri']}</p>
                <p><span>Kelas:</span> ${hasil.Kelas}</p>
                <p><span>Asrama:</span> ${hasil.Asrama}</p>
                <p><span>Wali Santri:</span> ${hasil['Wali Santri']}</p>
            `;
            document.getElementById('santriInfo').innerHTML = htmlInfo;
            santriCard.style.display = 'block';
            document.getElementById('summaryBox').style.display = 'block';
            
            hitungTotal();
        } else {
            errorMsg.innerText = "NIS tidak ditemukan di database pesantren!";
            errorMsg.style.display = 'block';
        }
    }

    function hitungTotal() {
        if (!santriAktif) return;

        let nominalPerBulan = parseInt(santriAktif.Nominal) || 0;
        let jmlBulan = parseInt(document.getElementById('bulanSelect').value);
        let total = nominalPerBulan * jmlBulan;

        document.getElementById('nominalAsli').innerText = "Rp " + nominalPerBulan.toLocaleString('id-ID');
        document.getElementById('jmlBulanText').innerText = jmlBulan + " Bulan";
        document.getElementById('totalBayar').innerText = "Rp " + total.toLocaleString('id-ID');

        // Atur link pembayaran online Mayar.id Anda (bisa disesuaikan link produk Mayar Anda)
        let linkMayar = `https://mayar.id/@spp-ppfha?amount=${total}&name=${encodeURIComponent(santriAktif['Nama Santri'])}&note=SPP_${santriAktif.NIS}`;
        document.getElementById('btnOnline').href = linkMayar;
    }

    function loginBendahara() {
        let password = prompt("Masukkan Password Khusus Bendahara:");
        if (password === "bendahara123") {
            document.getElementById('cashSection').style.display = 'block';
            alert("Login Bendahara Berhasil! Tombol catat tunai diaktifkan.");
        } else if (password !== null) {
            alert("Password Salah!");
        }
    }

    function catatTunai() {
        if (!santriAktif) return;
        let jmlBulan = document.getElementById('bulanSelect').value;
        let nominalPerBulan = parseInt(santriAktif.Nominal) || 0;
        let total = nominalPerBulan * jmlBulan;
        let noHpWali = santriAktif['No Hp'] || "";

        let pesan = `Assalamu'alaikum, konfirmasi pembayaran SPP Pondok Pesantren Fathul Huda Al-Qarobiyah:\n\n*Nama:* ${santriAktif['Nama Santri']}\n*NIS:* ${santriAktif.NIS}\n*Kelas:* ${santriAktif.Kelas}\n*Jumlah:* ${jmlBulan} Bulan (Rp ${total.toLocaleString('id-ID')})\n*Status:* LUNAS (Tunai/Cash)\n\nTerima kasih.`;

        let urlWa = `https://wa.me/62${noHpWali.replace(/^0+/, '')}?text=${encodeURIComponent(pesan)}`;
        window.open(urlWa, '_blank');
    }
</script>

</body>
</html>
