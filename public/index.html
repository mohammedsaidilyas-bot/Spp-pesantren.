<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran SPP - PPFHA</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #334155;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
        }
        .logo-box {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .content {
            padding: 24px 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0f766e;
        }
        .santri-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 20px;
            display: none;
        }
        .santri-info p {
            font-size: 14px;
            margin-bottom: 6px;
        }
        .santri-info span {
            font-weight: 600;
            color: #1e293b;
        }
        .months-container {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .month-checkbox {
            display: flex;
            align-items: center;
            font-size: 13px;
            background: white;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
        }
        .month-checkbox input {
            margin-right: 8px;
            accent-color: #0d9488;
        }
        .total-section {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-online {
            background-color: #2563eb;
        }
        .btn-online:hover {
            background-color: #1d4ed8;
        }
        .btn-offline {
            background-color: #16a34a;
        }
        .btn-offline:hover {
            background-color: #15803d;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .footer {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/Spp-pesantren/Spp-pesantren/main/IMG_20260925_232356.png" alt="Logo Pesantren">
            </div>
            <h1>PP. Fathul Huda Al-Qarobiyah</h1>
            <p>Portal Pembayaran SPP Santri Online & Offline</p>
        </div>

        <div class="content">
            <div class="form-group">
                <label for="nisInput">Masukkan Nomor Induk Santri (NIS)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="nisInput" placeholder="Contoh: 20260001">
                    <button class="btn" style="width: 120px;" onclick="cariSantri()">Cek</button>
                </div>
                <div id="errorMsg" class="error-msg">NIS tidak ditemukan. Periksa kembali nomor Anda.</div>
            </div>

            <div id="santriCard" class="santri-card">
                <div class="santri-info">
                    <p>Nama: <span id="namaSantri">-</span></p>
                    <p>Kelas: <span id="kelasSantri">-</span></p>
                    <p>SPP per Bulan: <span id="nominalSantri">-</span></p>
                </div>

                <label style="margin-top: 14px;">Pilih Bulan Pembayaran:</label>
                <div class="months-container">
                    <label class="month-checkbox"><input type="checkbox" value="Juli" onchange="hitungTotal()"> Juli</label>
                    <label class="month-checkbox"><input type="checkbox" value="Agustus" onchange="hitungTotal()"> Agustus</label>
                    <label class="month-checkbox"><input type="checkbox" value="September" onchange="hitungTotal()"> September</label>
                    <label class="month-checkbox"><input type="checkbox" value="Oktober" onchange="hitungTotal()"> Oktober</label>
                    <label class="month-checkbox"><input type="checkbox" value="November" onchange="hitungTotal()"> November</label>
                    <label class="month-checkbox"><input type="checkbox" value="Desember" onchange="hitungTotal()"> Desember</label>
                </div>

                <div class="total-section">
                    <span>Total Tagihan:</span>
                    <span id="totalNominal" style="color: #0d9488;">Rp 0</span>
                </div>

                <div class="button-group">
                    <button class="btn btn-online" onclick="bayarOnline()">Bayar Online (Mayar.id / QRIS)</button>
                    <button class="btn btn-offline" onclick="bayarOffline()">Catat Bayar Tunai (Cash ke Bendahara)</button>
                </div>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 Pondok Pesantren Fathul Huda Al-Qarobiyah
        </div>
    </div>

    <script>
        const databaseSantri = {
            "20260001": { nama: "Jefry", kelas: "3 Aliyah", nominal: "150000" },
            "20260002": { nama: "Aditya", kelas: "1 Aliyah", nominal: "150000" },
            "20260003": { nama: "Fatah", kelas: "2 Tsanawiyah", nominal: "150000" },
            "20260004": { nama: "Arif", kelas: "2 Tsanawiyah", nominal: "150000" }
        };

        let santriDataAktif = null;

        function cariSantri() {
            const nis = document.getElementById('nisInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const santriCard = document.getElementById('santriCard');

            if (!nis) {
                alert('Silakan masukkan NIS terlebih dahulu.');
                return;
            }

            const santri = databaseSantri[nis];

            if (santri) {
                santriDataAktif = santri;
                document.getElementById('namaSantri').innerText = santri.nama;
                document.getElementById('kelasSantri').innerText = santri.kelas;
                document.getElementById('nominalSantri').innerText = 'Rp ' + Number(santri.nominal).toLocaleString('id-ID');
                
                document.querySelectorAll('.month-checkbox input').forEach(cb => cb.checked = false);
                document.getElementById('totalNominal').innerText = 'Rp 0';

                errorMsg.style.display = 'none';
                santriCard.style.display = 'block';
            } else {
                santriCard.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        function hitungTotal() {
            if (!santriDataAktif) return;
            const checkedMonths = document.querySelectorAll('.month-checkbox input:checked');
            const total = checkedMonths.length * Number(santriDataAktif.nominal);
            document.getElementById('totalNominal').innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        function bayarOnline() {
            const checkedMonths = document.querySelectorAll('.month-checkbox input:checked');
            if (checkedMonths.length === 0) {
                alert('Pilih minimal satu bulan pembayaran terlebih dahulu.');
                return;
            }
            const bulanList = Array.from(checkedMonths).map(cb => cb.value).join(', ');
            const total = checkedMonths.length * Number(santriDataAktif.nominal);

            window.location.href = `https://mayar.to/spp-pesantren?amount=${total}&notes=SPP_${santriDataAktif.nama}_Bulan_${bulanList}`;
        }

        function bayarOffline() {
            const checkedMonths = document.querySelectorAll('.month-checkbox input:checked');
            if (checkedMonths.length === 0) {
                alert('Pilih minimal satu bulan pembayaran terlebih dahulu.');
                return;
            }
            const bulanList = Array.from(checkedMonths).map(cb => cb.value).join(', ');
            const total = checkedMonths.length * Number(santriDataAktif.nominal);

            const konfirmasi = confirm(`Konfirmasi Pembayaran Tunai (Cash):\n\nNama: ${santriDataAktif.nama}\nKelas: ${santriDataAktif.kelas}\nBulan: ${bulanList}\nTotal: Rp ${total.toLocaleString('id-ID')}\n\nCatat pembayaran tunai ini?`);
            
            if (konfirmasi) {
                alert('Pembayaran tunai berhasil dicatat oleh Bendahara! Silakan berikan kwitansi fisik kepada wali santri.');
                document.querySelectorAll('.month-checkbox input').forEach(cb => cb.checked = false);
                document.getElementById('totalNominal').innerText = 'Rp 0';
            }
        }
    </script>
</body>
</html>
