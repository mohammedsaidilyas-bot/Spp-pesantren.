<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPFHA - Pembayaran SPP Pondok Pesantren Fathul Huda Al-Qarobiyah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://checkout.mayar.id/v1/checkout.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800 flex items-center justify-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 sm:rounded-3xl shadow-xl flex flex-col justify-between overflow-hidden">
        <!-- Header -->
        <header class="bg-emerald-700 text-white p-6 rounded-b-3xl shadow-md text-center">
            <h1 class="text-xl font-bold">PPFHA</h1>
            <p class="text-xs text-emerald-100 mt-1">Pondok Pesantren Fathul Huda Al-Qarobiyah</p>
        </header>

        <!-- Main Content -->
        <main class="p-5 flex-grow space-y-4">
            <!-- Form Cek NIS / Login Santri -->
            <div id="login-section" class="space-y-4 pt-4">
                <h2 class="text-base font-semibold text-slate-700">Cek Tagihan & Pembayaran SPP</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Nomor Induk Santri (NIS)</label>
                    <input type="text" id="nis-input" placeholder="Masukkan NIS (Contoh: 20260000)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <button onclick="cekSantri()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold text-sm hover:bg-emerald-700 transition shadow-sm">Masuk / Cek Status</button>
            </div>

            <!-- Panel Hasil / Pembayaran -->
            <div id="payment-section" class="hidden space-y-4">
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 space-y-1">
                    <span class="text-[10px] uppercase tracking-wider text-emerald-600 font-bold">Informasi Santri</span>
                    <p id="info-nama" class="text-base font-bold text-emerald-950">-</p>
                    <div class="text-xs text-emerald-800 space-y-0.5 pt-1">
                        <p>NIS: <span id="info-nis" class="font-medium">-</span></p>
                        <p>Wali Santri: <span id="info-wali" class="font-medium">-</span></p>
                        <p>No. WhatsApp Wali: <span id="info-hp" class="font-medium">-</span></p>
                        <p>Status SPP: <span id="info-status" class="font-bold">-</span></p>
                    </div>
                </div>

                <!-- Pilihan Bulan & Nominal dalam 1 Baris Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Bulan</label>
                        <select id="bulan-select" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-xs font-medium">
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September" selected>September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Nominal (Rp)</label>
                        <input type="text" id="nominal-input" value="150000" readonly class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-600 text-xs font-semibold">
                    </div>
                </div>

                <!-- Tombol Aksi -->
                <div id="action-buttons" class="space-y-2.5 pt-1">
                    <button onclick="bayarOnline()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-xs hover:bg-indigo-700 transition shadow-sm">Bayar Online (Mayar.id)</button>
                    <button onclick="bukaModalTunai()" class="w-full bg-amber-600 text-white py-3 rounded-xl font-semibold text-xs hover:bg-amber-700 transition shadow-sm">Bayar Tunai / Offline (PIN Bendahara)</button>
                    <button onclick="kirimKuitansiWA()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold text-xs hover:bg-emerald-700 transition shadow-sm flex items-center justify-center space-x-1.5">
                        <span>Kirim Kuitansi ke WhatsApp Wali</span>
                    </button>
                </div>
                
                <button onclick="resetForm()" class="w-full text-slate-400 text-xs py-1 hover:text-slate-600 transition">← Kembali / Cari NIS Lain</button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="p-4 text-center text-[10px] text-slate-400 border-t border-slate-100">
            &copy; 2026 PPFHA - Sistem SPP Terpadu
        </footer>
    </div>

    <!-- Modal PIN Tunai -->
    <div id="pin-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-xl space-y-4">
            <h3 class="text-base font-bold text-slate-800">Otorisasi Bendahara</h3>
            <p class="text-xs text-slate-500">Masukkan PIN bendahara untuk mencatat pembayaran tunai secara langsung.</p>
            <input type="password" id="pin-input" placeholder="Masukkan PIN" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500 text-center tracking-widest text-base">
            <div class="flex space-x-2">
                <button onclick="tutupModalTunai()" class="w-1/2 bg-slate-100 text-slate-600 py-2.5 rounded-xl font-semibold text-xs">Batal</button>
                <button onclick="prosesTunai()" class="w-1/2 bg-amber-600 text-white py-2.5 rounded-xl font-semibold text-xs hover:bg-amber-700">Konfirmasi</button>
            </div>
        </div>
    </div>

    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzYhVYm2zXGj6IvHAS6lDuvlYs3DupbEKB405nmoKxIj9W_40T0sO1u82VWQtBsQd0Apw/exec";
        
        let currentNis = "";
        let currentNama = "";
        let currentWali = "";
        let currentHp = "";
        let currentNominal = "150000";
        let dataSantriList = [];

        // Fungsi canggih untuk mencocokkan berbagai variasi nama kolom di Google Sheets
        function cariData(obj, keywords) {
            for (let key of Object.keys(obj)) {
                let cleanKey = key.toLowerCase().trim();
                for (let kw of keywords) {
                    if (cleanKey === kw || cleanKey.includes(kw)) {
                        return obj[key];
                    }
                }
            }
            return null;
        }

        async function cekSantri() {
            const nis = document.getElementById('nis-input').value.trim();
            if (!nis) {
                alert('Silakan masukkan NIS terlebih dahulu.');
                return;
            }

            try {
                const res = await axios.get(scriptUrl);
                dataSantriList = res.data;
                const santri = dataSantriList.find(s => String(cariData(s, ['nis', 'no induk'])) === String(nis));

                if (santri) {
                    currentNis = cariData(santri, ['nis', 'no induk']) || nis;
                    currentNama = cariData(santri, ['nama', 'nama santri']) || "Santri PPFHA";
                    currentWali = cariData(santri, ['wali', 'wali santri', 'orang tua', 'ortu', 'ayah', 'ibu']) || "-";
                    currentHp = cariData(santri, ['hp', 'whatsapp', 'telp', 'phone', 'wa', 'no hp', 'nomor hp']) || "";
                    
                    let dbNominal = cariData(santri, ['nominal', 'spp', 'biaya', 'tagihan']);
                    if (dbNominal) {
                        currentNominal = String(dbNominal).replace(/[^0-9]/g, '');
                    }

                    document.getElementById('info-nama').innerText = currentNama;
                    document.getElementById('info-nis').innerText = currentNis;
                    document.getElementById('info-wali').innerText = currentWali;
                    document.getElementById('info-hp').innerText = currentHp ? currentHp : "(Belum ada nomor HP di Sheets)";
                    document.getElementById('nominal-input').value = "Rp " + Number(currentNominal).toLocaleString('id-ID');

                    const statusEl = document.getElementById('info-status');
                    const statusVal = cariData(santri, ['status', 'status spp']) || "BELUM LUNAS";
                    statusEl.innerText = statusVal;
                    statusEl.className = statusVal.toUpperCase() === "LUNAS" ? "font-bold text-emerald-600" : "font-bold text-red-600";

                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('payment-section').classList.remove('hidden');
                } else {
                    alert('NIS tidak ditemukan di database.');
                }
            } catch (err) {
                console.error(err);
                alert('Gagal mengambil data dari Google Sheets.');
            }
        }

        function bayarOnline() {
            const bulan = document.getElementById('bulan-select').value;
            alert(`Mengarahkan ke Mayar.id untuk pembayaran SPP bulan ${bulan} (Nominal: Rp ${Number(currentNominal).toLocaleString('id-ID')})`);
        }

        function bukaModalTunai() {
            document.getElementById('pin-modal').classList.remove('hidden');
        }

        function tutupModalTunai() {
            document.getElementById('pin-modal').classList.add('hidden');
            document.getElementById('pin-input').value = "";
        }

        async function prosesTunai() {
            const pin = document.getElementById('pin-input').value.trim();
            if (pin !== "1234") {
                alert('PIN Bendahara salah!');
                return;
            }

            const bulan = document.getElementById('bulan-select').value;
            try {
                await axios.post(scriptUrl, JSON.stringify({ nis: currentNis, bulan: bulan }), {
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                alert(`Pembayaran tunai SPP bulan ${bulan} berhasil dicatat & status menjadi LUNAS.`);
                tutupModalTunai();
                cekSantri(); // Refresh data otomatis setelah bayar
            } catch (err) {
                console.error(err);
                alert('Gagal memperbarui status ke Google Sheets.');
            }
        }

        function kirimKuitansiWA() {
            if (!currentHp) {
                alert('Nomor WhatsApp wali santri belum tercatat di database Google Sheets.');
                return;
            }

            let formattedHp = String(currentHp).trim();
            if (formattedHp.startsWith('0')) {
                formattedHp = '62' + formattedHp.slice(1);
            } else if (formattedHp.startsWith('+62')) {
                formattedHp = formattedHp.slice(1);
            }

            const bulan = document.getElementById('bulan-select').value;
            const pesan = `*KUITANSI PEMBAYARAN SPP PPFHA*\n\nNama Santri: ${currentNama}\nNIS: ${currentNis}\nWali Santri: ${currentWali}\nBulan: ${bulan}\nNominal: Rp ${Number(currentNominal).toLocaleString('id-ID')}\nStatus: *LUNAS*\n\nTerima kasih, pembayaran telah dikonfirmasi oleh Bendahara Pondok Pesantren Fathul Huda Al-Qarobiyah.`;
            
            const encodedPesan = encodeURIComponent(pesan);
            window.open(`https://wa.me/${formattedHp}?text=${encodedPesan}`, '_blank');
        }

        function resetForm() {
            currentNis = "";
            currentNama = "";
            currentWali = "";
            currentHp = "";
            currentNominal = "150000";
            document.getElementById('nis-input').value = "";
            document.getElementById('payment-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
