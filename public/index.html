<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d5c36; /* Hijau tua elegan khas pesantren */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        /* Bagian Header Atas */
        .brand-container {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .logo-circle {
            width: 75px;
            height: 75px;
            background: #ffffff;
            color: #0d5c36;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .brand-container h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .brand-container p {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 400;
        }

        /* Kartu Utama Input */
        .search-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: #0d5c36;
            box-shadow: 0 0 0 3px rgba(13, 92, 54, 0.15);
        }

        .btn-cek {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cek:hover {
            background: #1d4ed8;
        }

        /* Pilihan Bulan & Tombol Bayar (Muncul setelah NIS ditemukan/diisi) */
        .payment-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: none; /* Muncul dinamis */
        }

        .payment-section select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            margin-bottom: 12px;
            background: #fff;
        }

        .btn-bayar {
            width: 100%;
            background: #0d5c36;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-bayar:hover {
            background: #094428;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 24px 32px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e2e8f0;
            border-top-color: #0d5c36;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <!-- Header Logo & Nama Lembaga sesuai Gambar -->
    <div class="brand-container">
        <div class="logo-circle">
            <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Input NIS -->
    <div class="search-card">
        <label class="input-label" for="nis">Masukkan Nomor Induk Santri (NIS)</label>
        <div class="input-group">
            <input type="text" id="nis" placeholder="Contoh: 20260000" autocomplete="off">
            <button class="btn-cek" onclick="tampilOpsiBayar()">Cek</button>
        </div>

        <!-- Bagian Pilihan Bulan & Proses Pembayaran -->
        <div class="payment-section" id="paymentSection">
            <label class="input-label" for="bulan">Pilih Bulan Pembayaran:</label>
            <select id="bulan">
                <option value="Juli">Juli</option>
                <option value="Agustus">Agustus</option>
                <option value="September">September</option>
                <option value="Oktober">Oktober</option>
                <option value="November" selected>November</option>
                <option value="Desember">Desember</option>
                <option value="Januari">Januari</option>
                <option value="Februari">Februari</option>
                <option value="Maret">Maret</option>
                <option value="April">April</option>
                <option value="Mei">Mei</option>
                <option value="Juni">Juni</option>
            </select>
            <button class="btn-bayar" onclick="prosesPembayaran()">Bayar & Buat Kolom Otomatis</button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text">Memproses transaksi ke Spreadsheet...</div>
        </div>
    </div>

<script>
    // URL Web App Google Apps Script terbaru Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKc7a7Wag2S1hnEfkM7d0ipPdnMy13HnK_6Ct7CeJb9wl28wxgl8I0Wwu5cL5_81TgbQ/exec";

    function tampilOpsiBayar() {
        var nis = document.getElementById("nis").value.trim();
        if (!nis) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }
        // Munculkan pilihan bulan setelah tombol Cek diklik
        document.getElementById("paymentSection").style.display = "block";
    }

    function prosesPembayaran() {
        var nis = document.getElementById("nis").value.trim();
        var bulan = document.getElementById("bulan").value;

        if (!nis) {
            alert("NIS tidak boleh kosong!");
            return;
        }

        var dataKirim = {
            nis: nis,
            bulan: bulan
        };

        // Tampilkan animasi loading
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dataKirim)
        })
        .then(response => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Sukses! Pembayaran untuk bulan " + bulan (NIS: + nis + ") berhasil diproses. Jika kolom bulan tersebut belum ada di Google Sheets, sistem telah otomatis membuatnya.");
            document.getElementById("nis").value = "";
            document.getElementById("paymentSection").style.display = "none";
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            console.error("Error:", error);
            alert("Terjadi kesalahan koneksi. Silakan coba lagi.");
        });
    }
</script>

</body>
</html>
