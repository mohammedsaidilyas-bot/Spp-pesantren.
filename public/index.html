<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SPP - PPFHA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #008953; --bg: linear-gradient(135deg, #008953 0%, #004d2e 100%); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; color: #0f172a; }
        .card { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .title { text-align: center; color: #fff; margin-bottom: 15px; font-size: 16px; font-weight: 700; }
        .label { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; text-transform: uppercase; display: block; }
        .group { display: flex; gap: 8px; margin-bottom: 12px; }
        input { width: 100%; padding: 10px; font-size: 13px; border: 1.5px solid #e2e8f0; border-radius: 8px; outline: none; background: #f8fafc; }
        input:focus { border-color: var(--primary); background: #fff; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 0 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .info-box { border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: 10px; font-size: 13px; }
        .row { display: flex; justify-content: space-between; padding: 4px 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
        .pill { background: #fff; border: 1.5px solid #e2e8f0; padding: 10px 2px; text-align: center; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .pill:hover { border-color: var(--primary); background: #f0fdf4; }
        .pill.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pill.lunas { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-act { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; color: #fff; cursor: pointer; }
        .btn-mayar { background: #6366f1; }
        .btn-tunai { background: #d97706; }
        .btn-act:disabled { background: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="title">PP. Fathul Huda Al-Qarobiyah</div>

    <div class="card">
        <label class="label">Nomor Induk Santri (NIS)</label>
        <div class="group">
            <input type="text" id="nis" value="20260000">
            <button class="btn" onclick="cekData()">Cek</button>
        </div>

        <div class="info-box">
            <div class="row"><b>Nama:</b> <span id="nama">Mohammed Said Ilyas</span></div>
            <div class="row"><b>Kelas:</b> <span id="kelas">Takhoss</span></div>
            
            <label class="label" style="margin-top: 10px;">Pilih Bulan Pembayaran:</label>
            <!-- DIV INI YANG MENAMPUNG NAMA BULAN -->
            <div class="grid" id="bulanGrid"></div>

            <div class="row" style="margin-top: 10px; font-weight: 700;">
                <span>Total:</span>
                <span id="total" style="color: var(--primary);">Rp 0</span>
            </div>

            <div id="pinBox" style="display: none; margin-top: 10px;">
                <label class="label">PIN Bendahara (123456)</label>
                <input type="password" id="pin" placeholder="Masukkan PIN...">
            </div>

            <div class="actions">
                <button id="btnOnline" class="btn-act btn-mayar" onclick="bayar('Online')" disabled><i class="fa-solid fa-globe"></i> Online</button>
                <button id="btnTunai" class="btn-act btn-tunai" onclick="bayarTunai()" disabled><i class="fa-solid fa-money-bill-wave"></i> Tunai</button>
            </div>
        </div>
    </div>

<script>
    const database = {
        "20260000": {
            nama: "Mohammed Said Ilyas", 
            kelas: "Takhoss", 
            telp: "6282219644442",
            bayar: { 
                "Juli": "BELUM", "Agustus": "BELUM", "September": "LUNAS", 
                "Oktober": "BELUM", "November": "BELUM", "Desember": "BELUM", 
                "Januari": "BELUM", "Februari": "BELUM", "Maret": "BELUM", 
                "April": "BELUM", "Mei": "BELUM", "Juni": "BELUM" 
            }
        }
    };

    const daftarBulan = ["Juli", "Agustus", "September", "Oktober", "November", "Desember", "Januari", "Februari", "Maret", "April", "Mei", "Juni"];
    let selectedBulan = new Set();
    let santriAktif = database["20260000"];

    function cekData() {
        let val = document.getElementById("nis").value.trim();
        if(database[val]) {
            santriAktif = database[val];
            document.getElementById("nama").innerText = santriAktif.nama;
            document.getElementById("kelas").innerText = santriAktif.kelas;
            selectedBulan.clear();
            renderGridBulan();
        } else { 
            alert("Data santri tidak ditemukan!"); 
        }
    }

    function renderGridBulan() {
        let grid = document.getElementById("bulanGrid");
        if (!grid) return;
        
        grid.innerHTML = "";

        daftarBulan.forEach(b => {
            let isLunas = santriAktif.bayar[b] === "LUNAS";
            let isSel = selectedBulan.has(b);
            
            let div = document.createElement("div");
            div.className = `pill ${isLunas ? 'lunas' : ''} ${isSel ? 'selected' : ''}`;
            div.innerText = b;
            
            div.onclick = function() {
                if (isLunas) {
                    alert("Bulan " + b + " sudah lunas!");
                    return;
                }
                if (isSel) {
                    selectedBulan.delete(b);
                } else {
                    selectedBulan.add(b);
                }
                renderGridBulan();
            };
            
            grid.appendChild(div);
        });

        let total = selectedBulan.size * 150000;
        document.getElementById("total").innerText = "Rp " + total.toLocaleString("id-ID");
        
        let adaPilihan = selectedBulan.size > 0;
        document.getElementById("btnOnline").disabled = !adaPilihan;
        document.getElementById("btnTunai").disabled = !adaPilihan;
    }

    function bayarTunai() {
        let box = document.getElementById("pinBox");
        if(box.style.display === "none" || box.style.display === "") {
            box.style.display = "block";
            document.getElementById("pin").focus();
        } else {
            let pinVal = document.getElementById("pin").value.trim();
            if(pinVal !== "123456") {
                alert("PIN Bendahara Salah!"); 
                return;
            }
            bayar("Tunai / Offline");
        }
    }

    function bayar(metode) {
        let bulans = Array.from(selectedBulan);
        bulans.forEach(b => santriAktif.bayar[b] = "LUNAS");
        
        let totalBayar = bulans.length * 150000;
        let text = `*KUITANSI PEMBAYARAN SPP*%0ANama: ${santriAktif.nama}%0ABulan: ${bulans.join(", ")}%0ATotal: Rp ${totalBayar.toLocaleString("id-ID")}%0AStatus: LUNAS (${metode})`;
        
        window.location.href = `https://api.whatsapp.com/send?phone=${santriAktif.telp}&text=${text}`;
    }

    // Pastikan fungsi render langsung dipanggil begitu halaman dimuat
    window.onload = function() {
        renderGridBulan();
    };
</script>
</body>
</html>
