<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #008953;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #008953 0%, #004d2e 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
        }

        /* Header Brand & Logo Dibuat Sangat Rapat */
        .brand-container {
            text-align: center;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .logo-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
        }

        .brand-container h1 {
            font-size: 17px;
            font-weight: 700;
            margin-top: -6px;
            margin-bottom: 2px;
        }

        .brand-container p {
            font-size: 11px;
            color: #a7f3d0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kartu Utama */
        .search-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            font-size: 13.5px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 137, 83, 0.08);
        }

        .btn-cek {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 16px;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-cek:hover {
            background: #1d4ed8;
        }

        /* Bagian Informasi & Aksi */
        .result-section {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: block;
        }

        /* Desain Header Nama Santri */
        .santri-header-box {
            display: flex;
            flex-direction: column;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .nama-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .nama-label-small {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .nama-value-big {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            padding: 5px 0;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        /* Layout Grid Pilihan Bulan Lebih Simpel & Kompak */
        .bulan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .bulan-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bulan-pill:hover:not(.lunas) {
            border-color: var(--primary);
            background: #f0fdf4;
        }

        .bulan-pill input {
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .bulan-pill.lunas {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        /* PIN Bendahara Lebih Halus & Minimalis */
        #pinContainer {
            display: none;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pin-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .pin-header i {
            color: #d97706;
        }

        /* Tombol Aksi yang Lebih Kecil, Ramping & Elegan */
        .action-buttons-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            border: none;
            padding: 9px 10px;
            font-size: 12.5px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        .btn-action:hover:not(:disabled) { 
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-action:disabled {
            background: #cbd5e1 !important;
            cursor: not-allowed;
            box-shadow: none;
            color: #64748b;
        }

        .btn-mayar { background: #6366f1; } 
        .btn-tunai { background: #d97706; } 

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 77, 46, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 16px 22px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header Brand -->
    <div class="brand-container">
        <div class="logo-wrapper">
            <img src="https://lh3.googleusercontent.com/d/1nisPkmO93MQycG2iEWxMduwWb6ZOh0kA" alt="Logo PP. Fathul Huda Al-Qarobiyah">
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Utama -->
    <div class="search-card">
        <div style="margin-bottom: 12px;">
            <label class="input-label" for="nis">Nomor Induk Santri (NIS)</label>
            <div class="input-group">
                <input type="text" id="nis" placeholder="Contoh: 20260000" autocomplete="off" value="20260000">
                <button class="btn-cek" onclick="cekDataSantri()">Cek</button>
            </div>
        </div>

        <!-- Bagian Informasi & Aksi -->
        <div class="result-section" id="resultSection">
            <!-- Kotak Nama Santri -->
            <div class="santri-header-box">
                <div class="nama-top-row">
                    <div>
                        <div class="nama-label-small">Nama Santri</div>
                        <div class="nama-value-big" id="txtNama">-</div>
                    </div>
                </div>
            </div>

            <div style="margin-bottom: 10px;">
                <div class="info-row">
                    <span class="info-label">NIS</span>
                    <span class="info-value" id="txtNis">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kelas</span>
                    <span class="info-value" id="txtKelas">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Wali Santri</span>
                    <span class="info-value" id="txtWali">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">No. Telepon</span>
                    <span class="info-value" id="txtTelp">-</span>
                </div>
                <!-- Status Pembayaran Bulan Ini (Kembali Ditampilkan) -->
                <div class="info-row" style="border-top: 1px dashed var(--border-color); margin-top: 6px; padding-top: 6px;">
                    <span class="info-label">Status Bulan Ini (Juli)</span>
                    <span class="info-value" id="txtStatusBulanInfo" style="font-weight: 700;">-</span>
                </div>
            </div>

            <!-- Pilihan Bulan Model Kotak Grid Minimalis -->
            <div>
                <label class="input-label">Pilih Bulan Pembayaran (Bisa > 1)</label>
                <div class="bulan-grid" id="bulanGridGroup">
                    <!-- Diisi otomatis oleh JavaScript -->
                </div>
            </div>

            <!-- Total Tagihan & Nominal -->
            <div style="margin-bottom: 12px;">
                <div class="info-row" style="background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border-color);">
                    <span class="info-label" style="font-weight: 700; color: var(--text-main);">Total Tagihan Dipilih</span>
                    <span class="info-value" id="txtTotalTagihan" style="color: var(--primary); font-size: 14px;">Rp 0</span>
                </div>
            </div>

            <!-- PIN Bendahara Lebih Halus & Minimalis -->
            <div id="pinContainer">
                <div class="pin-header">
                    <i class="fa-solid fa-shield-halved"></i> Autorisasi PIN Bendahara
                </div>
                <input type="password" id="kodeBendahara" placeholder="Masukkan 6 digit PIN..." autocomplete="current-password">
            </div>

            <!-- Tombol Aksi Berjajar, Kecil, & Elegan -->
            <div class="action-buttons-group">
                <button id="btnOnline" class="btn-action btn-mayar" onclick="prosesPembayaran('Online / Mayar.id')" disabled>
                    <i class="fa-solid fa-globe"></i> Online
                </button>
                <button id="btnTunai" class="btn-action btn-tunai" onclick="handleBayarTunaiClick()" disabled>
                    <i class="fa-solid fa-money-bill-wave"></i> Tunai (PIN)
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Memproses...</div>
        </div>
    </div>

<script>
    // Database Santri
    const databaseSantri = {
        "20260000": {
            nis: "20260000",
            nama: "Mohammed Said Ilyas",
            kelas: "Takhoss",
            wali: "H. Ilyas Aly",
            telp: "082219644442",
            pembayaran: {
                "Juli": "BELUM LUNAS",
                "Agustus": "BELUM LUNAS",
                "September": "BELUM LUNAS",
                "Oktober": "BELUM LUNAS",
                "November": "BELUM LUNAS",
                "Desember": "BELUM LUNAS",
                "Januari": "BELUM LUNAS",
                "Februari": "BELUM LUNAS",
                "Maret": "BELUM LUNAS",
                "April": "BELUM LUNAS",
                "Mei": "BELUM LUNAS",
                "Juni": "BELUM LUNAS"
            }
        }
    };

    const PIN_BENDAHARA_VALID = "123456";
    const NOMINAL_PER_BULAN = 150000;
    const daftarBulan = ["Juli", "Agustus", "September", "Oktober", "November", "Desember", "Januari", "Februari", "Maret", "April", "Mei", "Juni"];

    let santriCache = null;

    window.addEventListener('DOMContentLoaded', (event) => {
        cekDataSantri();
    });

    function cekDataSantri() {
        var nisInput = document.getElementById("nis").value.trim();
        if (!nisInput) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }

        document.getElementById("loaderText").innerText = "Mencari data santri...";
        document.getElementById("loadingOverlay").style.display = "flex";

        setTimeout(() => {
            document.getElementById("loadingOverlay").style.display = "none";
            
            if (databaseSantri[nisInput]) {
                santriCache = databaseSantri[nisInput];
                
                document.getElementById("txtNama").innerText = santriCache.nama;
                document.getElementById("txtNis").innerText = santriCache.nis;
                document.getElementById("txtKelas").innerText = santriCache.kelas;
                document.getElementById("txtWali").innerText = santriCache.wali;
                document.getElementById("txtTelp").innerText = santriCache.telp;
                
                renderBulanGrid();
                updateStatusBulanPertama();
                hitungTotalNominal();
                
                document.getElementById("pinContainer").style.display = "none";
                document.getElementById("resultSection").style.display = "block";
            } else {
                alert("Santri dengan NIS " + nisInput + " tidak ditemukan!");
                document.getElementById("resultSection").style.display = "none";
            }
        }, 200);
    }

    function renderBulanGrid() {
        if (!santriCache || !santriCache.pembayaran) return;
        var container = document.getElementById("bulanGridGroup");
        container.innerHTML = "";

        daftarBulan.forEach(bulan => {
            var status = (santriCache.pembayaran[bulan] || "BELUM LUNAS").toUpperCase();
            var isLunas = (status === "LUNAS");

            var label = document.createElement("label");
            label.className = "bulan-pill" + (isLunas ? " lunas" : "");

            var textSpan = document.createElement("span");
            textSpan.innerText = bulan.substring(0, 3); // Singkatan 3 huruf agar sangat rapi (Jul, Ags, Sep, dst)

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = bulan;
            checkbox.disabled = isLunas;
            checkbox.onchange = hitungTotalNominal;

            label.appendChild(textSpan);
            label.appendChild(checkbox);
            container.appendChild(label);
        });
    }

    function updateStatusBulanPertama() {
        if (!santriCache || !santriCache.pembayaran) return;
        var statusJuli = (santriCache.pembayaran["Juli"] || "BELUM LUNAS").toUpperCase();
        var txtStatusBulanInfo = document.getElementById("txtStatusBulanInfo");

        if (statusJuli === "LUNAS") {
            txtStatusBulanInfo.innerHTML = "<span style='color: #00663b;'>LUNAS</span>";
        } else {
            txtStatusBulanInfo.innerHTML = "<span style='color: #991b1b;'>BELUM LUNAS</span>";
        }
    }

    function hitungTotalNominal() {
        var checkboxes = document.querySelectorAll("#bulanGridGroup input[type='checkbox']:checked");
        var jumlahPilih = checkboxes.length;
        var total = jumlahPilih * NOMINAL_PER_BULAN;

        document.getElementById("txtTotalTagihan").innerText = "Rp " + total.toLocaleString("id-ID");

        var btnOnline = document.getElementById("btnOnline");
        var btnTunai = document.getElementById("btnTunai");

        if (jumlahPilih === 0) {
            btnOnline.disabled = true;
            btnTunai.disabled = true;
            document.getElementById("pinContainer").style.display = "none";
        } else {
            btnOnline.disabled = false;
            btnTunai.disabled = false;
        }
    }

    function handleBayarTunaiClick() {
        var checkboxes = document.querySelectorAll("#bulanGridGroup input[type='checkbox']:checked");
        if (checkboxes.length === 0) {
            alert("Pilih minimal satu bulan pembayaran terlebih dahulu!");
            return;
        }

        var pinContainer = document.getElementById("pinContainer");
        if (pinContainer.style.display === "none" || pinContainer.style.display === "") {
            pinContainer.style.display = "block";
            document.getElementById("kodeBendahara").focus();
        } else {
            prosesPembayaran("Tunai / Offline");
        }
    }

    function prosesPembayaran(metode) {
        var checkboxes = document.querySelectorAll("#bulanGridGroup input[type='checkbox']:checked");
        if (checkboxes.length === 0) {
            alert("Pilih minimal satu bulan p
