<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d5c36;
            --primary-light: #10b981;
            --bg-gradient: linear-gradient(135deg, #0d5c36 0%, #06331e 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --warning-bg: #fef3c7;
            --warning-text: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 16px;
        }

        /* Header Brand */
        .brand-container {
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #ffffff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .brand-container h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .brand-container p {
            font-size: 12px;
            color: #a7f3d0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kartu Utama */
        .search-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(13, 92, 54, 0.1);
        }

        .btn-cek {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cek:hover {
            background: #1d4ed8;
        }

        /* Bagian Informasi & Pembayaran */
        .result-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .santri-info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .badge-lunas {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-belum {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .form-group-custom {
            margin-bottom: 14px;
        }

        .form-group-custom select, .form-group-custom input {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
        }

        #pinGroup {
            display: none; /* Hanya muncul jika metode Tunai/Offline dipilih */
            background: #fdf2f8;
            border: 1.5px dashed #f472b6;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .btn-bayar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-bayar:hover {
            background: #094428;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 51, 30, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 20px 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header Brand -->
    <div class="brand-container">
        <div class="logo-circle">
            <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Utama -->
    <div class="search-card">
        <label class="input-label" for="nis">Nomor Induk Santri (NIS)</label>
        <div class="input-group">
            <input type="text" id="nis" placeholder="Contoh: 20260001" autocomplete="off">
            <button class="btn-cek" onclick="cekDataSantri()">Cek</button>
        </div>

        <!-- Bagian Informasi & Pembayaran -->
        <div class="result-section" id="resultSection">
            <div class="santri-info-box">
                <div class="info-row">
                    <span class="info-label">Nama Santri</span>
                    <span class="info-value" id="txtNama">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kelas</span>
                    <span class="info-value" id="txtKelas">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Wali Santri</span>
                    <span class="info-value" id="txtWali">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">No. Telepon</span>
                    <span class="info-value" id="txtTelp">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">SPP</span>
                    <span class="info-value"><span id="txtStatusSpp" class="badge-belum">-</span></span>
                </div>
            </div>

            <!-- Pilihan Metode Pembayaran -->
            <div class="form-group-custom">
                <label class="input-label" for="metode">Metode Pembayaran</label>
                <select id="metode" onchange="togglePinBendahara()">
                    <option value="Tunai / Offline">Tunai / Offline (Bayar di Kantor)</option>
                    <option value="Online / Transfer">Online / Transfer Bank / QRIS</option>
                </select>
            </div>

            <!-- Input Kode/PIN Bendahara khusus Offline -->
            <div id="pinGroup" class="form-group-custom">
                <label class="input-label" for="kodeBendahara" style="color: #be185d;">
                    <i class="fa-solid fa-lock"></i> Masukkan Kode / PIN Bendahara
                </label>
                <input type="password" id="kodeBendahara" placeholder="Masukkan PIN khusus bendahara" autocomplete="current-password">
            </div>

            <!-- Pilihan Bulan Pembayaran -->
            <div class="form-group-custom">
                <label class="input-label" for="bulan">Pilih Bulan Pembayaran</label>
                <select id="bulan" onchange="updateStatusBulan()">
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November" selected>November</option>
                    <option value="Desember">Desember</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                </select>
            </div>

            <button class="btn-bayar" onclick="prosesPembayaran()">
                <i class="fa-solid fa-circle-check"></i> Proses Pembayaran & Kirim Kuitansi WA
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Memeriksa database...</div>
        </div>
    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVEoquoZd9ojPxubLyHjUfGp6yDQm_Kqjw8gCFPiE9hJXRZyJeommvr-O_5XzJ1YRAEQ/exec";

    // KODE BENDAHARA RESMI (Anda dapat mengganti PIN ini sesuai keinginan)
    const PIN_BENDAHARA_VALID = "PPFHA2026"; 

    let santriCache = null;

    function togglePinBendahara() {
        var metode = document.getElementById("metode").value;
        var pinGroup = document.getElementById("pinGroup");
        if (metode === "Tunai / Offline") {
            pinGroup.style.display = "block";
        } else {
            pinGroup.style.display = "none";
        }
    }

    function cekDataSantri() {
        var nis = document.getElementById("nis").value.trim();
        if (!nis) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }

        document.getElementById("loaderText").innerText = "Mencari data santri...";
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL + "?nis=" + encodeURIComponent(nis))
        .then(response => response.json())
        .then(data => {
            document.getElementById("loadingOverlay").style.display = "none";
            if (data && data.found) {
                santriCache = data;
                document.getElementById("txtNama").innerText = data.nama;
                document.getElementById("txtKelas").innerText = data.kelas;
                document.getElementById("txtWali").innerText = data.wali;
                document.getElementById("txtTelp").innerText = data.telp;
                
                updateStatusBulan();
                togglePinBendahara(); // Cek status awal metode pembayaran

                document.getElementById("resultSection").style.display = "block";
            } else {
                alert("Santri dengan NIS " + nis + " tidak ditemukan!");
                document.getElementById("resultSection").style.display = "none";
            }
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            console.error(error);
            alert("Gagal terhubung ke database. Pastikan backend Google Apps Script sudah disinkronkan.");
        });
    }

    function updateStatusBulan() {
        if (!santriCache || !santriCache.pembayaran) return;
        var bulanPilih = document.getElementById("bulan").value;
        var statusBulan = santriCache.pembayaran[bulanPilih] || "BELUM LUNAS";
        
        var elStatus = document.getElementById("txtStatusSpp");
        elStatus.innerText = statusBulan;

        if (statusBulan.toUpperCase() === "LUNAS") {
            elStatus.className = "badge-lunas";
        } else {
            elStatus.className = "badge-belum";
        }
    }

    function prosesPembayaran() {
        var nis = document.getElementById("nis").value.trim();
        var bulan = document.getElementById("bulan").value;
        var metode = document.getElementById("metode").value;

        if (!nis) return;

        // Validasi PIN Bendahara jika memilih pembayaran Offline / Tunai
        if (metode === "Tunai / Offline") {
            var inputPin = document.getElementById("kodeBendahara").value.trim();
            if (inputPin !== PIN_BENDAHARA_VALID) {
                alert("Akses Ditolak! Kode/PIN Bendahara yang Anda masukkan salah.");
                return;
            }
        }

        var dataKirim = { 
            nis: nis, 
            bulan: bulan, 
            metode: metode 
        };

        document.getElementById("loaderText").innerText = "Menyimpan data & menyiapkan kuitansi WA...";
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataKirim)
        })
        .then(() => {
            document.getElementById("loadingOverlay").style.display = "none";
            
            // Perbarui status lokal menjadi LUNAS
            if (santriCache && santriCache.pembayaran) {
                santriCache.pembayaran[bulan] = "LUNAS";
                updateStatusBulan();
            }

            alert("Pembayaran bulan " + bulan + " berhasil dicatat dan status diperbarui menjadi LUNAS!");

            // OTOMATIS KIRIM KUITANSI KE WHATSAPP TANPA DIKLIK MANUAL
            kirimWhatsAppOtomatis();

            // Reset form input PIN & NIS
            document.getElementById("kodeBendahara").value = "";
            document.getElementById("nis").value = "";
            document.getElementById("resultSection").style.display = "none";
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Terjadi kesalahan: " + error);
        });
    }

    function kirimWhatsAppOtomatis() {
        if (!santriCache) return;

        var nama = santriCache.nama;
        var nis = santriCache.nis || document.getElementById("nis").value;
        var kelas = santriCache.kelas;
        var wali = santriCache.wali;
        var telp = santriCache.telp;
        var bulan = document.getElementById("bulan").value;
        var metode = document.getElementById("metode").value;
        var tanggal = new Date().toLocaleDateString("id-ID", { day: 'numeric', month: 'long', year: 'numeric' });

        let noWa = telp.trim();
        if (noWa.startsWith('0')) {
            noWa = '62' + noWa.substring(1);
        }

        let pesan = `*KUITANSI PEMBAYARAN SPP*
*Pondok Pesantren Fathul Huda Al-Qarobiyah*
---------------------------------------
📅 *Tanggal:* ${tanggal}
💳 *Metode:* ${metode}
---------------------------------------
👤 *Nama Santri:* ${nama}
🆔 *NIS:* ${nis}
🏫 *Kelas:* ${kelas}
👨‍👩‍👦 *Wali Santri:* ${wali}
---------------------------------------
📌 *Untuk Pembayaran SPP Bulan:* *${bulan}*
✅ *Status:* LUNAS
---------------------------------------
Terima kasih, pembayaran Anda telah tercatat sah di sistem database pesantren.`;

        let urlWa = `https://api.whatsapp.com/send?phone=${noWa}&text=${encodeURIComponent(pesan)}`;
        
        // Membuka tab WhatsApp secara otomatis untuk mengirim kuitansi
        window.open(urlWa, '_blank');
    }
</script>

</body>
</html>
