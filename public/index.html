<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #064e3b;
            --primary-light: #059669;
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-bg: #d1fae5;
            --success-text: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        /* Bagian Header Brand */
        .brand-container {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .logo-circle {
            width: 75px;
            height: 75px;
            background: #ffffff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .brand-container h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .brand-container p {
            font-size: 13px;
            color: #a7f3d0;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Kartu Utama */
        .search-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .input-group input:focus {
            border-color: var(--primary-light);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        .btn-cek {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-cek:hover {
            background: #1d4ed8;
        }

        /* Bagian Informasi Santri & Pembayaran (Tampil setelah Cek) */
        .result-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none; /* Muncul setelah NIS ditemukan */
        }

        .santri-info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .badge-status {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .payment-group {
            margin-bottom: 14px;
        }

        .payment-group select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
        }

        .btn-bayar {
            width: 100%;
            background: var(--primary-light);
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-bayar:hover {
            background: #047857;
        }

        /* Loading Overlay */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 44, 34, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 24px 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header Brand -->
    <div class="brand-container">
        <div class="logo-circle">
            <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Utama -->
    <div class="search-card">
        <label class="input-label" for="nis">Nomor Induk Santri (NIS)</label>
        <div class="input-group">
            <input type="text" id="nis" placeholder="Contoh: 20260001" autocomplete="off">
            <button class="btn-cek" onclick="cekDataSantri()">Cek</button>
        </div>

        <!-- Bagian Informasi & Pembayaran (Muncul setelah tombol Cek diklik) -->
        <div class="result-section" id="resultSection">
            
            <!-- Kotak Informasi Detail Santri -->
            <div class="santri-info-box">
                <div class="info-row">
                    <span class="info-label">Nama Santri</span>
                    <span class="info-value" id="txtNama">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Kelas</span>
                    <span class="info-value" id="txtKelas">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Wali Santri</span>
                    <span class="info-value" id="txtWali">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">No. Telepon</span>
                    <span class="info-value" id="txtTelp">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status Terakhir</span>
                    <span class="info-value"><span class="badge-status" id="txtStatus">AKTIF</span></span>
                </div>
            </div>

            <!-- Pilihan Bulan & Tombol Pembayaran -->
            <div class="payment-group">
                <label class="input-label" for="bulan">Pilih Bulan Pembayaran</label>
                <select id="bulan">
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November" selected>November</option>
                    <option value="Desember">Desember</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                </select>
            </div>

            <button class="btn-bayar" onclick="prosesPembayaran()">
                <i class="fa-solid fa-circle-check"></i> Bayar & Buat Kolom Otomatis
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">Memeriksa data santri...</div>
        </div>
    </div>

<script>
    // URL Web App Google Apps Script terbaru Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKc7a7Wag2S1hnEfkM7d0ipPdnMy13HnK_6Ct7CeJb9wl28wxgl8I0Wwu5cL5_81TgbQ/exec";

    function cekDataSantri() {
        var nis = document.getElementById("nis").value.trim();
        if (!nis) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }

        // Tampilkan loading sebentar mensimulasikan pencarian data
        document.getElementById("loaderText").innerText = "Mencari data santri...";
        document.getElementById("loadingOverlay").style.display = "flex";

        setTimeout(function() {
            document.getElementById("loadingOverlay").style.display = "none";
            
            // Contoh data info santri yang ditemukan (bisa disesuaikan dengan respons database Anda)
            document.getElementById("txtNama").innerText = "Santri NIS " + nis;
            document.getElementById("txtKelas").innerText = "Tsanawiyah / Aliyah";
            document.getElementById("txtWali").innerText = "Wali Santri";
            document.getElementById("txtTelp").innerText = "08xxxxxxxxxx";
            document.getElementById("txtStatus").innerText = "TERVERIFIKASI";

            // Munculkan kotak informasi dan pilihan pembayaran
            document.getElementById("resultSection").style.display = "block";
        }, 600);
    }

    function prosesPembayaran() {
        var nis = document.getElementById("nis").value.trim();
        var bulan = document.getElementById("bulan").value;

        if (!nis) {
            alert("NIS tidak boleh kosong!");
            return;
        }

        var dataKirim = {
            nis: nis,
            bulan: bulan
        };

        document.getElementById("loaderText").innerText = "Memproses pembayaran & membuat kolom...";
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dataKirim)
        })
        .then(response => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Sukses! Pembayaran SPP bulan " + bulan + " untuk NIS " + nis + " berhasil dicatat. Kolom bulan otomatis dibuat dan status diperbarui menjadi LUNAS.");
            
            // Reset tampilan
            document.getElementById("nis").value = "";
            document.getElementById("resultSection").style.display = "none";
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            console.error("Error:", error);
            alert("Terjadi kesalahan koneksi. Silakan periksa jaringan Anda.");
        });
    }
</script>

</body>
</html>
