<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Pembayaran SPP - PP Fathul Huda Al-Qorrobiyah</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 untuk Notifikasi -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px 0;
    }
    .card-main {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      background: #ffffff;
      overflow: hidden;
    }
    .header-box {
      background-color: #157347;
      color: white;
      padding: 25px 20px;
      text-align: center;
      border-radius: 16px 16px 0 0;
    }
    .info-santri-box {
      background-color: #f0fdf4;
      border: 1px solid #dcfce7;
      border-radius: 12px;
      padding: 16px;
    }
    .btn-online {
      background-color: #6366f1;
      color: white;
      border: none;
    }
    .btn-online:hover {
      background-color: #4f46e5;
      color: white;
    }
    .btn-tunai {
      background-color: #d97706;
      color: white;
      border: none;
    }
    .btn-tunai:hover {
      background-color: #b45309;
      color: white;
    }
    .action-btn {
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-main">
          
          <!-- Header dengan Lambang Pondok & Nama Lengkap -->
          <div class="header-box">
            <div class="mb-2">
              <i class="fas fa-mosque fa-2x text-white"></i>
            </div>
            <h5 class="fw-bold mb-1" style="font-size: 1.1rem;">PP Fathul Huda Al-Qorrobiyah</h5>
            <p class="mb-0 text-white-50 small">Portal Pembayaran SPP Santri</p>
          </div>

          <div class="card-body p-4">
            
            <!-- Form Input NIS (Tampil di awal) -->
            <div id="sectionCari" class="mb-3">
              <label class="form-label fw-semibold small text-muted">MASUKKAN NIS SANTRI</label>
              <div class="input-group">
                <input type="text" id="nisInput" class="form-control" placeholder="Contoh: 20260000" required>
                <button class="btn btn-success px-4" type="button" onclick="cariSantri()">Cari</button>
              </div>
            </div>

            <!-- Bagian Detail & Aksi (Muncul setelah NIS ditemukan) -->
            <div id="sectionAksi" class="d-none">
              
              <!-- Kotak Informasi Santri -->
              <div class="info-santri-box mb-4">
                <span class="text-success fw-bold small text-uppercase" style="font-size: 11px;">Informasi Santri</span>
                <h5 class="fw-bold text-dark mt-1 mb-2" id="txtNama">-</h5>
                <p class="mb-1 small text-secondary">NIS: <span id="txtNis" class="fw-semibold text-dark">-</span></p>
                <p class="mb-1 small text-secondary">Wali Santri: <span id="txtWali" class="fw-semibold text-dark">-</span></p>
                <p class="mb-1 small text-secondary">No. Telepon: <span id="txtWa" class="fw-semibold text-dark">-</span></p>
                <p class="mb-0 small text-secondary">Status SPP: <span id="txtStatus" class="fw-bold text-danger">BELUM LUNAS</span></p>
              </div>

              <!-- Pilihan Bulan & Nominal -->
              <div class="row g-2 mb-4">
                <div class="col-7">
                  <label class="form-label small text-muted fw-semibold">Bulan</label>
                  <select id="selectBulan" class="form-select">
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September" selected>September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                  </select>
                </div>
                <div class="col-5">
                  <label class="form-label small text-muted fw-semibold">Nominal</label>
                  <input type="text" id="txtNominal" class="form-control bg-light text-dark fw-bold" value="Rp 50.000" readonly>
                </div>
              </div>

              <!-- Tombol Aksi -->
              <button type="button" class="btn action-btn btn-online shadow-sm" onclick="prosesBayarOnline()">
                Bayar Online (Mayar.id)
              </button>

              <button type="button" class="btn action-btn btn-tunai shadow-sm" onclick="prosesBayarTunai()">
                Bayar Tunai / Offline (PIN Bendahara)
              </button>

              <!-- Tombol Kembali / Cari NIS Lain -->
              <div class="text-center mt-3">
                <a href="#" onclick="resetForm(event)" class="text-decoration-none text-muted small">
                  &larr; Kembali / Cari NIS Lain
                </a>
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbzYhVYm2zXGj6IvHAS6lDuvlYs3DupbEKB405nmoKxIj9W_40T0sO1u82VWQtBsQd0Apw/exec";
    let globalDataSantri = null;

    function cariSantri() {
      let nis = document.getElementById('nisInput').value.trim();
      if(!nis) {
        Swal.fire('Peringatan', 'Masukkan NIS terlebih dahulu!', 'warning');
        return;
      }

      Swal.fire({
        title: 'Mencari data...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
          Swal.close();
          let santri = data.find(item => {
            let valNis = item.NIS || item.nis || '';
            return String(valNis).trim() === nis;
          });
          
          if(santri) {
            globalDataSantri = santri;
            
            let nama = santri['Nama Santri'] || santri['nama santri'] || santri['Nama'] || '-';
            let wali = santri['Wali Santri'] || santri['wali santri'] || '-';
            let wa = santri['NoTeleponAktif'] || '';
            let nominal = parseInt(santri['Nominal'] || santri['nominal']) || 50000;

            document.getElementById('txtNama').innerText = nama;
            document.getElementById('txtNis').innerText = nis;
            document.getElementById('txtWali').innerText = wali;
            document.getElementById('txtWa').innerText = wa ? wa : '(Nomor Telepon belum diisi)';
            document.getElementById('txtNominal').value = "Rp " + nominal.toLocaleString('id-ID');

            cekStatusBulan();

            document.getElementById('sectionCari').classList.add('d-none');
            document.getElementById('sectionAksi').classList.remove('d-none');
          } else {
            Swal.fire('Tidak Ditemukan', 'Data santri dengan NIS tersebut tidak ditemukan.', 'error');
          }
        })
        .catch(err => {
          Swal.close();
          Swal.fire('Error', 'Gagal terhubung ke database server.', 'error');
        });
    }

    document.getElementById('selectBulan').addEventListener('change', cekStatusBulan);

    function cekStatusBulan() {
      if(!globalDataSantri) return;
      let bulanPilihan = document.getElementById('selectBulan').value;
      let statusBulan = String(globalDataSantri[bulanPilihan] || "").trim().toUpperCase();
      
      let elStatus = document.getElementById('txtStatus');
      if(statusBulan === "LUNAS") {
        elStatus.innerText = "LUNAS";
        elStatus.className = "fw-bold text-success";
      } else {
        elStatus.innerText = "BELUM LUNAS";
        elStatus.className = "fw-bold text-danger";
      }
    }

    async function prosesBayarTunai() {
      if(!globalDataSantri) return;

      const { value: pin } = await Swal.fire({
        title: 'Proteksi Bendahara',
        input: 'password',
        inputLabel: 'Masukkan PIN Bendahara',
        inputPlaceholder: 'Masukkan 6 digit PIN',
        showCancelButton: true,
        confirmButtonText: 'Konfirmasi',
        cancelButtonText: 'Batal'
      });

      if (pin !== "123456") {
        if(pin !== undefined) Swal.fire('Gagal', 'PIN Bendahara salah!', 'error');
        return;
      }

      let nis = document.getElementById('nisInput').value.trim();
      let bulanTarget = document.getElementById('selectBulan').value;

      Swal.fire({
        title: 'Memproses Pembayaran...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      let payload = { nis: nis, bulan: bulanTarget };

      fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(result => {
          Swal.close();
          if(result.status === "success") {
            globalDataSantri[bulanTarget] = "LUNAS";
            cekStatusBulan();

            kirimWaOtomatis(bulanTarget);

            Swal.fire('Berhasil!', 'Pembayaran Tunai tercatat dan kuitansi dikirim ke WhatsApp.', 'success');
          } else {
            Swal.fire('Gagal', 'Terjadi kesalahan pada server.', 'error');
          }
        })
        .catch(err => {
          Swal.close();
          Swal.fire('Error', 'Gagal koneksi ke server.', 'error');
        });
    }

    function kirimWaOtomatis(bulanTarget) {
      if(!globalDataSantri) return;
      let nis = document.getElementById('nisInput').value.trim();
      let nama = document.getElementById('txtNama').innerText;
      let wali = document.getElementById('txtWali').innerText;
      let kelas = globalDataSantri['Kelas'] || globalDataSantri['kelas'] || '-';
      
      let rawWa = String(globalDataSantri['NoTeleponAktif'] || '').trim().replace(/[^0-9]/g, "");

      if(rawWa.startsWith("0")) {
        rawWa = "62" + rawWa.substring(1);
      }

      if(!rawWa) {
        Swal.fire('Perhatian', 'Nomor telepon kosong atau tidak terbaca.', 'warning');
        return;
      }

      let pesan = `*KUITANSI PEMBAYARAN SPP*%0A` +
                  `*PP Fathul Huda Al-Qorrobiyah*%0A%0A` +
                  `-----------------------------------%0A` +
                  `NIS : *${nis}*%0A` +
                  `Nama : *${nama}*%0A` +
                  `Kelas : *${kelas}*%0A` +
                  `Wali Santri : *${wali}*%0A` +
                  `Bulan : *${bulanTarget}*%0A` +
                  `Status : *LUNAS*%0A%0A` +
                  `Terima kasih. Pembayaran telah dikonfirmasi oleh Bendahara.`;

      let urlWa = `https://wa.me/${rawWa}?text=${pesan}`;
      window.open(urlWa, '_blank');
    }

    function prosesBayarOnline() {
      let nis = document.getElementById('nisInput').value.trim();
      let nama = document.getElementById('txtNama').innerText;
      let bulanTarget = document.getElementById('selectBulan').value;
      let nominalStr = document.getElementById('txtNominal').value.replace(/[^0-9]/g, '');

      let linkPayment = `https://mayar.id/@ppfha/spp?nis=${nis}&nama=${encodeURIComponent(nama)}&amount=${nominalStr}&bulan=${encodeURIComponent(bulanTarget)}`;

      Swal.fire({
        title: 'Pembayaran Online',
        text: `Anda akan diarahkan ke Mayar.id untuk pembayaran bulan ${bulanTarget}.`,
        icon: 'info',
        showCancelButton: true,
        confirmButtonText: 'Lanjut',
        cancelButtonText: 'Batal'
      }).then((res) => {
        if(res.isConfirmed) {
          window.open(linkPayment, '_blank');
        }
      });
    }

    function resetForm(e) {
      e.preventDefault();
      document.getElementById('nisInput').value = '';
      document.getElementById('sectionCari').classList.remove('d-none');
      document.getElementById('sectionAksi').classList.add('d-none');
      globalDataSantri = null;
    }
  </script>
</body>
</html>
