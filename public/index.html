<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembayaran SPP - PP. Fathul Huda Al-Qarobiyah</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #064e3b;
            --primary-light: #059669;
            --accent: #34d399;
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Bagian Brand Header */
        .brand-container {
            text-align: center;
            margin-bottom: 28px;
            color: #ffffff;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: #ffffff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .logo-circle:hover {
            transform: scale(1.05);
        }

        .brand-container h1 {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .brand-container p {
            font-size: 13px;
            color: #a7f3d0;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Kartu Utama Minimalis Modern */
        .search-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group-container {
            margin-bottom: 4px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-light);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
        }

        .btn-cek {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cek:hover {
            background: var(--primary-light);
        }

        .btn-cek:active {
            transform: scale(0.97);
        }

        /* Bagian Opsi Bulan & Tombol Bayar */
        .payment-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            display: none; /* Muncul setelah NIS dikonfirmasi */
            animation: fadeIn 0.4s ease-out;
        }

        .payment-section select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            margin-bottom: 14px;
            background: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-section select:focus {
            border-color: var(--primary-light);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12);
        }

        .btn-bayar {
            width: 100%;
            background: #059669;
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-bayar:hover {
            background: #047857;
        }

        .btn-bayar:active {
            transform: scale(0.98);
        }

        /* Loading Overlay Modern */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 44, 34, 0.6);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loader-box {
            background: white;
            padding: 24px 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Header Lembaga -->
    <div class="brand-container">
        <div class="logo-circle">
            <i class="fa-solid fa-mosque"></i>
        </div>
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <!-- Kartu Interaktif -->
    <div class="search-card">
        <div class="input-group-container">
            <label class="input-label" for="nis">Nomor Induk Santri (NIS)</label>
            <div class="input-wrapper">
                <input type="text" id="nis" placeholder="Contoh: 20260000" autocomplete="off">
                <button class="btn-cek" onclick="tampilOpsiBayar()">Cek</button>
            </div>
        </div>

        <!-- Bagian Pilihan Bulan & Tombol Konfirmasi -->
        <div class="payment-section" id="paymentSection">
            <label class="input-label" for="bulan">Pilih Bulan Pembayaran</label>
            <select id="bulan">
                <option value="Juli">Juli</option>
                <option value="Agustus">Agustus</option>
                <option value="September">September</option>
                <option value="Oktober">Oktober</option>
                <option value="November" selected>November</option>
                <option value="Desember">Desember</option>
                <option value="Januari">Januari</option>
                <option value="Februari">Februari</option>
                <option value="Maret">Maret</option>
                <option value="April">April</option>
                <option value="Mei">Mei</option>
                <option value="Juni">Juni</option>
            </select>
            <button class="btn-bayar" onclick="prosesPembayaran()">
                <i class="fa-solid fa-circle-check"></i> Bayar & Buat Kolom Otomatis
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loadingOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="loader-text">Menyinkronkan ke Spreadsheet...</div>
        </div>
    </div>

<script>
    // URL Web App Google Apps Script terbaru Anda
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwKc7a7Wag2S1hnEfkM7d0ipPdnMy13HnK_6Ct7CeJb9wl28wxgl8I0Wwu5cL5_81TgbQ/exec";

    function tampilOpsiBayar() {
        var nis = document.getElementById("nis").value.trim();
        if (!nis) {
            alert("Harap masukkan Nomor Induk Santri (NIS) terlebih dahulu!");
            return;
        }
        // Menampilkan pilihan bulan dengan efek transisi halus
        document.getElementById("paymentSection").style.display = "block";
    }

    function prosesPembayaran() {
        var nis = document.getElementById("nis").value.trim();
        var bulan = document.getElementById("bulan").value;

        if (!nis) {
            alert("NIS tidak boleh kosong!");
            return;
        }

        var dataKirim = {
            nis: nis,
            bulan: bulan
        };

        // Tampilkan loading overlay
        document.getElementById("loadingOverlay").style.display = "flex";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dataKirim)
        })
        .then(response => {
            document.getElementById("loadingOverlay").style.display = "none";
            alert("Berhasil! Transaksi bulan " + bulan + " untuk NIS " + nis + " telah diproses. Kolom bulan (jika baru) otomatis dibuat dan status diperbarui.");
            document.getElementById("nis").value = "";
            document.getElementById("paymentSection").style.display = "none";
        })
        .catch(error => {
            document.getElementById("loadingOverlay").style.display = "none";
            console.error("Error:", error);
            alert("Terjadi kesalahan koneksi. Silakan periksa jaringan Anda.");
        });
    }
</script>

</body>
</html>
