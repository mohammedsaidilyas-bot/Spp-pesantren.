<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran SPP - PPFHA</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-color: #047857;
            --primary-dark: #065f46;
            --accent-color: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-light: #6b7280;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header Blok Hijau Penuh */
        .header-hero {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .logo-pesantren {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            background-color: white;
            border: 3px solid white;
            margin: 0 auto 12px auto;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .header-hero h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header-hero p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .content-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .label-input {
            font-size: 0.85rem;
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background: #fafafa;
        }
        .search-box input:focus {
            border-color: var(--primary-color);
            background: white;
        }
        .search-box button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background-color: var(--primary-dark);
        }
        .loading {
            text-align: center;
            color: var(--text-light);
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .error-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .santri-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: none;
        }
        .santri-info {
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 16px;
            color: var(--text-color);
        }
        .santri-info strong {
            color: var(--primary-dark);
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 10px;
        }
        /* Grid Checkbox Bulan */
        .months-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .month-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .month-item:hover {
            border-color: var(--primary-color);
            background: #f0fdf4;
        }
        .month-item input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }
        .summary-box {
            border-top: 1px dashed #d1d5db;
            padding-top: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-box span {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .summary-box .total-amount {
            font-size: 1.15rem;
            color: var(--primary-color);
            font-weight: 700;
        }
        .btn-pay {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn-pay:hover {
            background-color: var(--primary-dark);
        }
        .cash-section {
            margin-top: 10px;
            border-top: 1px dashed #d1d5db;
            padding-top: 12px;
            display: none;
        }
        .btn-cash {
            width: 100%;
            background-color: #d97706;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cash:hover {
            background-color: #b45309;
        }
        .footer-admin {
            text-align: center;
            margin-top: auto;
            padding: 20px 0;
            font-size: 0.8rem;
        }
        .footer-admin a {
            color: var(--text-light);
            text-decoration: none;
        }
        .footer-admin a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Header Hijau dengan Logo -->
    <div class="header-hero">
        <img src="IMG_20260925_232356.png" alt="Logo PPFHA" class="logo-pesantren" onerror="this.style.display='none'">
        <h1>PP. Fathul Huda Al-Qarobiyah</h1>
        <p>Portal Pembayaran SPP Santri</p>
    </div>

    <div class="content-body">
        <div class="loading" id="loadingText">Memuat database santri...</div>

        <label class="label-input" for="nisInput">Masukkan Nomor Induk Santri (NIS)</label>
        <div class="search-box">
            <input type="number" id="nisInput" placeholder="Contoh: 20260001" />
            <button onclick="cariSantri()">Cek</button>
        </div>

        <div class="error-msg" id="errorMsg">NIS tidak ditemukan di database!</div>

        <div class="santri-card" id="santriCard">
            <div class="santri-info" id="santriInfo"></div>
            
            <div class="section-title">Pilih Bulan Pembayaran:</div>
            
            <div class="months-grid">
                <label class="month-item"><input type="checkbox" value="Juli" onchange="hitungTotal()"> Juli</label>
                <label class="month-item"><input type="checkbox" value="Agustus" onchange="hitungTotal()"> Agustus</label>
                <label class="month-item"><input type="checkbox" value="September" onchange="hitungTotal()"> September</label>
                <label class="month-item"><input type="checkbox" value="Oktober" onchange="hitungTotal()"> Oktober</label>
                <label class="month-item"><input type="checkbox" value="November" onchange="hitungTotal()"> November</label>
                <label class="month-item"><input type="checkbox" value="Desember" onchange="hitungTotal()"> Desember</label>
            </div>

            <div class="summary-box">
                <span>Total Tagihan:</span>
                <span class="total-amount" id="totalBayar">Rp 0</span>
            </div>

            <a href="#" id="btnOnline" class="btn-pay" target="_blank">Bayar Online (Mayar.id / QRIS)</a>

            <!-- Area Tombol Khusus Bendahara -->
            <div class="cash-section" id="cashSection">
                <button class="btn-cash" onclick="catatTunai()">Catat Pembayaran Tunai (Cash)</button>
            </div>
        </div>

        <div class="footer-admin">
            <a href="#" onclick="loginBendahara()">Login Khusus Bendahara (Cash)</a>
        </div>
    </div>
</div>

<script>
    let databaseSantri = [];
    let santriAktif = null;

    // Link CSV Google Sheets Anda
    const csvUrl = "https://docs.google.com/spreadsheets/d/1cqGQaKIOWmYopQPQyI5LTCB77wbLWKoxAqUBDGiSKMw/export?format=csv";

    window.onload = function() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                databaseSantri = results.data;
                document.getElementById('loadingText').style.display = 'none';
            },
            error: function(err) {
                document.getElementById('loadingText').innerText = "Gagal memuat database. Periksa koneksi.";
            }
        });
    };

    function cariSantri() {
        const nisCari = document.getElementById('nisInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const santriCard = document.getElementById('santriCard');

        errorMsg.style.display = 'none';
        santriCard.style.display = 'none';

        // Reset checkbox bulan
        document.querySelectorAll('.months-grid input').forEach(cb => cb.checked = false);

        if (!nisCari) {
            errorMsg.innerText = "Silakan masukkan NIS terlebih dahulu!";
            errorMsg.style.display = 'block';
            return;
        }

        const hasil = databaseSantri.find(s => String(s.NIS).trim() === nisCari);

        if (hasil) {
            santriAktif = hasil;
            let nominal = parseInt(hasil.Nominal) || 0;
            
            let htmlInfo = `
                NIS: <strong>${hasil.NIS}</strong><br>
                Nama: <strong>${hasil['Nama Santri']}</strong><br>
                Kelas: <strong>${hasil.Kelas}</strong><br>
                Asrama: <strong>${hasil.Asrama}</strong><br>
                Wali Santri: <strong>${hasil['Wali Santri']}</strong><br>
                SPP per Bulan: <strong>Rp ${nominal.toLocaleString('id-ID')}</strong>
            `;
            document.getElementById('santriInfo').innerHTML = htmlInfo;
            santriCard.style.display = 'block';
            hitungTotal();
        } else {
            errorMsg.innerText = "NIS tidak ditemukan di database pesantren!";
            errorMsg.style.display = 'block';
        }
    }

    function hitungTotal() {
        if (!santriAktif) return;

        let nominalPerBulan = parseInt(santriAktif.Nominal) || 0;
        let checkedBulan = document.querySelectorAll('.months-grid input:checked');
        let jumlahBulan = checkedBulan.length;
        let total = nominalPerBulan * jumlahBulan;

        document.getElementById('totalBayar').innerText = "Rp " + total.toLocaleString('id-ID');

        let listBulanStr = Array.from(checkedBulan).map(cb => cb.value).join(', ');
        let linkMayar = `https://mayar.id/@spp-ppfha?amount=${total}&name=${encodeURIComponent(santriAktif['Nama Santri'])}&note=SPP_${santriAktif.NIS}_${encodeURIComponent(listBulanStr)}`;
        document.getElementById('btnOnline').href = linkMayar;
    }

    function loginBendahara() {
        let password = prompt("Masukkan Password Khusus Bendahara:");
        if (password === "bendahara123") {
            document.getElementById('cashSection').style.display = 'block';
            alert("Login Bendahara Berhasil! Tombol catat tunai diaktifkan.");
        } else if (password !== null) {
            alert("Password Salah!");
        }
    }

    function catatTunai() {
        if (!santriAktif) return;
        let checkedBulan = document.querySelectorAll('.months-grid input:checked');
        if (checkedBulan.length === 0) {
            alert("Pilih minimal 1 bulan pembayaran terlebih dahulu!");
            return;
        }

        let nominalPerBulan = parseInt(santriAktif.Nominal) || 0;
        let total = nominalPerBulan * checkedBulan.length;
        let listBulanStr = Array.from(checkedBulan).map(cb => cb.value).join(', ');
        let noHpWali = santriAktif['No Hp'] || "";

        let pesan = `Assalamu'alaikum, konfirmasi pembayaran SPP Pondok Pesantren Fathul Huda Al-Qarobiyah:\n\n*NIS:* ${santriAktif.NIS}\n*Nama:* ${santriAktif['Nama Santri']}\n*Kelas:* ${santriAktif.Kelas}\n*Bulan:* ${listBulanStr}\n*Total:* Rp ${total.toLocaleString('id-ID')}\n*Status:* LUNAS (Tunai/Cash)\n\nTerima kasih.`;

        let urlWa = `https://wa.me/62${noHpWali.replace(/^0+/, '')}?text=${encodeURIComponent(pesan)}`;
        window.open(urlWa, '_blank');
    }
</script>

</body>
</html>
